name: action
run-name: ${{ github.actor }} asking for main action
on:
  push:
    branches-ignore:
      - "ga-ignore-*"
  pull_request:
    branches-ignore:
      - "ga-ignore-*"

jobs:
  auto_format:
    name: Auto Format Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GH repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Astyle
        run: sudo apt-get install -y astyle

      - name: Run Astyle
        run: |
          find . -name "*.cpp" -o -name "*.hpp" | xargs astyle --style=allman

  check_program_compilation:
    name: Check Program Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: auto_format
    steps:
      - name: Checkout GH repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (SFML)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsfml-dev

      - name: Remove build directory
        run: rm -rf build

      - name: Generate build files
        run: cmake -S . -B build

      - name: Compile project
        run: cmake --build build -- -j $(nproc --all)

      - name: Check executables
        run: |
          for file in ${{ vars.EXECUTABLES }}; do
            if [ ! -x "./build/client/${file}" ]; then
                echo "File $file does not exist or is not executable"
                exit 1
            fi
          done

  check_doc_build:
    name: Check Documentation Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GH repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (SFML)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsfml-dev

      - name: Clean CMake cache
        run: rm -rf CMakeCache.txt CMakeFiles Doxyfile *.cmake CMakeDoxyfile.in

      - name: Generate CMake files
        run: cmake .

      - name: Build documentation
        run: cmake --build . --target doc_doxygen || echo "No documentation target found, skipping."

  generate_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check_doc_build
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up cache for Doxygen
        id: cache-doxygen
        uses: actions/cache@v3
        with:
          path: doc_doygen/html
          key: ${{ runner.os }}-doxygen-${{ hashFiles('**/*.cpp', '**/*.h', 'Doxyfile') }}
          restore-keys: |
            ${{ runner.os }}-doxygen-

      - name: Install Doxygen and Graphviz
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Configure Doxygen
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        run: |
          # Generate a default Doxyfile if it doesn't exist
          if [ ! -f Doxyfile ]; then
            doxygen -g
          fi
          # Update Doxyfile settings
          sed -i 's/^PROJECT_NAME.*/PROJECT_NAME = "R-Type"/' Doxyfile
          sed -i 's/^OUTPUT_DIRECTORY.*/OUTPUT_DIRECTORY = docs/' Doxyfile
          sed -i 's/^GENERATE_LATEX.*/GENERATE_LATEX = NO/' Doxyfile
          sed -i 's/^RECURSIVE.*/RECURSIVE = YES/' Doxyfile
          sed -i 's/^GENERATE_HTML.*/GENERATE_HTML = YES/' Doxyfile

      - name: Generate Doxygen documentation
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        run: |
          doxygen Doxyfile | tee doxygen_output.log

      - name: Deploy Doxygen documentation
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git fetch origin
          git switch --orphan gh-pages || git checkout gh-pages
          # rm -rf *
          if [ -d "docs/html" ] && [ "$(ls -A docs/html)" ]; then
            # add the file named index.html that is my docs folder in my real project at the root of the gh-pages branch
            cp docs/html/index.html .

            cp -r doc_doxygen/html/* .
            touch .nojekyll  # Disable Jekyll to enable support for files and directories starting with underscore
            git add --all
            git commit -m "Deploy Doxygen documentation to GitHub Pages"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/matheo2027/R-Type.git gh-pages --force
          else
            echo "No documentation generated. Skipping deployment."
          fi

  push_to_mirror:
    name: Push to Mirror
    runs-on: ubuntu-latest
    needs: [check_program_compilation, check_doc_build]
    if: github.event_name == 'push' && needs.check_program_compilation.result == 'success' && needs.check_doc_build.result == 'success' && needs.generate_docs.result == 'success'
    steps:
      - name: Checkout GH repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ vars.MIRROR_URL }}
          ssh_private_key: ${{ secrets.R_TYPE }}