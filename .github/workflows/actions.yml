name: action
run-name: ${{ github.actor }} asking for main action
on:
  push:
    branches-ignore:
      - "ga-ignore-*"
  pull_request:
    branches-ignore:
      - "ga-ignore-*"

jobs:
  auto_format:
    name: Auto Format Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GH repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Astyle
        run: sudo apt-get install -y astyle

      - name: Run Astyle
        run: |
          find . -name "*.cpp" -o -name "*.hpp" | xargs astyle --style=allman

  check_program_compilation_ubuntu:
    name: Check Program Compilation on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: auto_format
    steps:
      - name: Checkout GH repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (SFML)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsfml-dev

      - name: Remove build directory
        run: rm -rf build

      - name: Generate build files
        run: cmake -S . -B build

      - name: Compile project
        run: cmake --build build -- -j $(nproc --all)

      - name: Check executables
        run: |
          for file in ${{ vars.EXECUTABLES }}; do
            if [ ! -x "./build/client/${file}" ]; then
                echo "File ${file} does not exist or is not executable"
                exit 1
            fi
          done

  check_program_compilation_windows:
    name: Check Program Compilation on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    needs: auto_format
    steps:
      - name: Checkout GH repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Download and install MSYS2
        run: |
          Invoke-WebRequest -Uri https://github.com/msys2/msys2-installer/releases/latest/download/msys2-x86_64-20210129.exe -OutFile msys2-installer.exe
          Start-Process -Wait -FilePath msys2-installer.exe -ArgumentList '/S', '/D=C:\msys64'
          Remove-Item -Force msys2-installer.exe
        
      - name: Update and install SFML and dependencies
        run: |
          C:\msys64\usr\bin\bash.exe -c "pacman -Syu --noconfirm"
          C:\msys64\usr\bin\bash.exe -c "pacman -S --noconfirm mingw-w64-x86_64-SFML mingw-w64-x86_64-toolchain"
        
      - name: Remove build directory if it exists
        run: |
          if (Test-Path build) {
            Remove-Item -Recurse -Force build
          }
        
      - name: Generate build files
        run: C:\msys64\mingw64\bin\cmake.exe -S . -B build
        
      - name: Compile project
        run: C:\msys64\mingw64\bin\cmake.exe --build build -- /m
        
      - name: Check executables
        run: |
          for %%f in (${{ vars.EXECUTABLES }}) do (
            if not exist .\build\client\%%f (
              echo "File %%f does not exist or is not executable"
              exit /b 1
            )
          )


  generate_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check_program_compilation_ubuntu, check_program_compilation_windows]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up cache for Doxygen
        id: cache-doxygen
        uses: actions/cache@v3
        with:
          path: docs/html
          key: ${{ runner.os }}-doxygen-${{ hashFiles('**/*.cpp', '**/*.h', 'Doxyfile') }}
          restore-keys: |
            ${{ runner.os }}-doxygen-

      - name: Install Doxygen and Graphviz
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Configure Doxygen
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        run: |
          if [ ! -f Doxyfile ]; then
            doxygen -g
          fi
          sed -i 's/^PROJECT_NAME.*/PROJECT_NAME = "R-Type"/' Doxyfile
          sed -i 's/^OUTPUT_DIRECTORY.*/OUTPUT_DIRECTORY = docs/' Doxyfile
          sed -i 's/^GENERATE_LATEX.*/GENERATE_LATEX = NO/' Doxyfile
          sed -i 's/^RECURSIVE.*/RECURSIVE = YES/' Doxyfile
          sed -i 's/^GENERATE_HTML.*/GENERATE_HTML = YES/' Doxyfile

      - name: Generate Doxygen documentation
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        run: |
          doxygen Doxyfile | tee doxygen_output.log

      - name: Deploy Doxygen documentation
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git fetch origin
          git switch --orphan gh-pages || git checkout gh-pages
          if [ -d "docs/html" ] && [ "$(ls -A docs/html)" ]; then
            cp -r docs/html/* .
            touch .nojekyll
            git add --all
            git commit -m "Deploy Doxygen documentation to GitHub Pages"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/matheo2027/R-Type.git gh-pages --force
          else
            echo "No documentation generated. Skipping deployment."
          fi

  push_to_mirror:
    name: Push to Mirror
    runs-on: ubuntu-latest
    needs: [check_program_compilation_ubuntu, check_program_compilation_windows, generate_docs]
    if: github.event_name == 'push' && needs.check_program_compilation_ubuntu.result == 'success' && needs.check_program_compilation_windows.result == 'success' && needs.generate_docs.result == 'success'
    steps:
      - name: Checkout GH repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ vars.MIRROR_URL }}
          ssh_private_key: ${{ secrets.R_TYPE }}
